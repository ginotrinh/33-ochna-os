# OCHNA-B3: manual build of the base image for VM tests, uploaded as an artifact
name: base

on:
  workflow_dispatch:
    inputs:
      kernel_run:
        description: "Run ID of a kernel workflow run whose kernel-debs artifact to use (empty = latest Release)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # OCHNA-U3: kernel from a test build instead of the latest Release
      - if: inputs.kernel_run != ''
        uses: actions/download-artifact@v4
        with:
          name: kernel-debs
          path: kdebs
          run-id: ${{ inputs.kernel_run }}
          github-token: ${{ github.token }}
      - name: build in ubuntu:26.04
        run: |
          docker run --rm --privileged -v "$PWD:/w" -w /w ubuntu:26.04 bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends \
              mmdebstrap e2fsprogs libarchive13t64 dosfstools mtools fdisk qemu-utils curl ca-certificates >/dev/null
            if [ -d kdebs ]; then export KERNEL_DIR=/w/kdebs; fi
            MMDEBSTRAP_MODE=root base/build.sh
            chown -R '"$(id -u):$(id -g)"' out
          '
          df -h /
      - uses: actions/upload-artifact@v4
        with:
          name: ochna-base
          path: |
            out/ochna-base.qcow2
            out/ochna-base.txt
          retention-days: 3
